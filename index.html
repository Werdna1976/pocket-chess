<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f4ee">
  <title>Pocket Chess</title>
</head>
<body>
  <header class="site-header"><div class="brand"><span id="brand-piece" aria-hidden="true"></span> Pocket Chess</div><span class="mode" id="mode"></span></header>
  <main>
    <section class="play" aria-label="Chessboard">
      <div class="player" id="top-player"></div>
      <div class="board" id="board" aria-label="Chess squares"></div>
      <div class="player" id="bottom-player"></div>
    </section>
    <aside class="sidebar" aria-label="Game controls">
      <div class="status" role="status" id="status"></div>
      <section class="history" aria-labelledby="history-title">
        <h2 id="history-title">Move history</h2>
        <div id="moves"></div>
      </section>
      <div class="actions">
        <button type="button" id="undo">Undo move</button>
        <button type="button" id="flip">Flip board</button>
        <button type="button" id="options-button">Game options</button>
      </div>
    </aside>
  </main>
  <dialog id="options" aria-labelledby="options-title">
    <h2 id="options-title">Game options</h2>
    <fieldset id="piece-sets">
      <legend>Piece set</legend>
    </fieldset>
    <form id="game-settings">
      <label>Opponent
        <select name="opponent">
          <option value="person">Person</option>
          <option value="computer">Computer</option>
        </select>
      </label>
      <label>White player name <input name="white" maxlength="40" placeholder="White"></label>
      <label><span id="black-label">Black player name</span> <input name="black" maxlength="40" placeholder="Black"></label>
      <label id="difficulty-field" hidden>Difficulty
        <select name="difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>
      <p class="options-note">Starting a new game clears the current board and move history.</p>
      <div class="options-actions">
        <button type="button" id="cancel-options">Cancel</button>
        <button type="submit">Start new game</button>
      </div>
    </form>
  </dialog>
  <dialog id="promotion" aria-labelledby="promotion-title">
    <h2 id="promotion-title">Promote pawn</h2>
    <div id="promotion-options"></div>
    <form method="dialog"><button>Cancel</button></form>
  </dialog>
  <script type="module" src="/src.js"></script>
</body>
</html>
